ont-weight:750}.btn{border:1px solid #cbd5e1;background:white;color:#334155;border-radius:9px;padding:9px 14px;font-weight:700}.btn:hover{filter:brightness(.97)}.btn.primary{background:#2563eb;border-color:#2563eb;color:white}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.sel{outline:2px solid #2563eb}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}.pill{border:1px solid var(--border);border-radius:12px;padding:10px;text-align:center;font-weight:750}.pill.active{outline:2px solid var(--accent,#2563eb)}.model{background:#ecfdf5;border:2px solid #34d399;border-radius:12px;padding:17px;color:#064e3b}.model .quote{font-size:21px;line-height:1.55;font-weight:650;margin:6px 0}.bad{background:#f8fafc;border-radius:11px;padding:15px}.bad strong{color:#be123c}.label{font-size:12px;font-weight:800;letter-spacing:.035em;text-transform:uppercase}.hidden{display:none!important}.sectionhead{font-size:19px;margin:3px 0 12px}.note{background:#f8fafc;border-left:4px solid #94a3b8;padding:11px 14px;border-radius:5px;font-size:14px}.bigtext{font-size:23px;line-height:1.6}.accentblue{background:#eff6ff;color:#1d4ed8}.accentgreen{background:#f0fdf4;color:#166534}.tech{border:1px solid #d5dce6;border-radius:9px;padding:11px;text-align:center;font-weight:750;min-height:60px}.tech.sel{outline:3px solid #2563eb}.match{border:1px solid #d6dde7;background:#fff;border-radius:9px;padding:11px;text-align:left;min-height:83px;width:100%;font-size:15px}.match.correct{border-color:#16a34a}.match.wrong{border:2px solid #ef4444}.match .tag{font-size:12px;display:block;margin-bottom:5px;font-weight:800}.phrase{border-radius:3px;padding:1px 2px}.pbutton{font-size:14px;border-radius:10px;padding:10px;border:1px solid transparent;font-weight:750}.tiprow{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:11px}.tiptop{display:flex;gap:10px;align-items:center;margin-bottom:9px}.num{border-radius:8px;padding:6px 12px;font-weight:850}.tipright{background:#f8fafc;border-radius:9px;padding:11px}.minihead{font-size:11px;font-weight:850;letter-spacing:.05em}.question{border:1px solid var(--border);border-radius:10px;padding:13px}.question button{min-width:45px;margin:3px 5px 0 0}.question .feedback{margin-top:7px;font-size:13px}.para{display:flex;gap:9px;align-items:center;text-align:left;width:100%;border:1px solid var(--border);border-radius:9px;padding:9px;background:#f8fafc;margin-bottom:7px}.para.short{background:#fff1f2}.para.active{outline:2px solid #64748b}.para .n{width:30px;height:30px;border-radius:6px;background:#dbeafe;display:grid;place-items:center;font-weight:800}.para.short .n{background:#ffe4e6;color:#9f1239}.check{display:flex;gap:9px;align-items:flex-start;margin:9px 0;font-size:14px}.check input{margin-top:5px;accent-color:#2563eb}.progress{height:8px;border-radius:99px;background:#e2e8f0;overflow:hidden}.progress div{height:100%;background:#16a34a;width:0;transition:width .2s}.photo{width:100%;max-height:360px;object-fit:cover;border-radius:10px}.taskbox{border:1px solid var(--border);border-radius:12px;padding:16px}.taskbox.active{outline:2px solid #60a5fa}.input{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:10px;min-height:65px;resize:vertical}footer{display:flex;justify-content:space-between;gap:12px;margin:14px 0 30px}.hide-mobile{display:block}@media(max-width:900px){.shell{grid-template-columns:1fr;padding:12px}.nav{position:static;display:flex;overflow:auto;gap:4px}.nav button{min-width:125px}.g7,.g6{grid-template-columns:repeat(3,minmax(0,1fr))}.g5{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.g2,.g3,.g4,.g5,.g6,.g7{grid-template-columns:1fr 1fr}.panel{padding:15px}.hero h2{font-size:23px}.bigtext{font-size:19px}.model .quote{font-size:18px}}@media print{header,.nav,.actions,footer{display:none!important}.shell{display:block}.activity{display:block!important;break-before:page}.panel{break-inside:avoid}body{background:white}}
</style></head><body><header><div class="top"><div><h1>✦ Creative Writing Masterclass</h1><small>AQA GCSE English Language · Paper 1 · Question 5</small></div><div class="small muted" id="stepCount">Activity 1 of 9</div></div></header><div class="shell"><nav class="nav" id="nav"></nav><main class="main"><div class="panel hero"><div class="eyebrow" id="activityLabel">Activity 1</div><h2 id="activityTitle">Show, Don't Tell</h2><p class="sub" id="activityDesc"></p></div><div id="activities"></div><footer><button class="btn" onclick="go(current-1)">← Previous activity</button><button class="btn primary" onclick="go(current+1)">Next activity →</button></footer></main></div><script>
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let current=0;
const titles=['Show, Don’t Tell','Match Literary Techniques','Interactive Technique Finder','Top 5 Creative Writing Tips','Sensory Language & Clichés','Advanced Punctuation','Paragraph Planning','Sentence Variety & Viewpoint','Question 5 Homework'];
const desc=['Transform basic statements into vivid descriptions.','Match eight techniques to their correct examples.','Identify literary techniques in a model paragraph.','Five essential strategies for more effective creative writing.','Use the five senses and avoid overused expressions.','Choose punctuation accurately to control pace and tension.','Compare five developed paragraphs with seven including two short paragraphs.','Explore first, second and third person, especially the immersive power of “you”.','Complete both choices from the supplied November 2024 exam as separate homeworks.'];
function go(n){current=Math.max(0,Math.min(8,n));document.querySelectorAll('.activity').forEach((e,i)=>e.classList.toggle('active',i===current));document.querySelectorAll('.nav button').forEach((e,i)=>e.classList.toggle('active',i===current));$('#activityLabel').textContent='ACTIVITY '+(current+1);$('#activityTitle').textContent=titles[current];$('#activityDesc').textContent=desc[current];$('#stepCount').textContent=`Activity ${current+1} of 9`;window.scrollTo({top:0,behavior:'smooth'});}
$('#nav').innerHTML=titles.map((t,i)=>`<button onclick="go(${i})">${i+1}. ${esc(t)}</button>`).join('');$('#activities').innerHTML=titles.map((t,i)=>`<section class="activity" id="a${i}"></section>`).join('');
const colors=['#dbeafe','#fce7f3','#dcfce7','#fef3c7','#ede9fe','#ffedd5','#ccfbf1','#f3e8ff'],inks=['#1d4ed8','#9d174d','#166534','#92400e','#6d28d9','#9a3412','#115e59','#7e22ce'];
const show=[['Sally looked through the window.','Sally peered through the mist-covered glass.','“Peered” is a precise verb; “mist-covered” creates mystery.'],['The forest was scary.','Twisted branches clawed at the fading daylight.','Personification makes the trees seem threatening.'],['The girl was frightened.','Her trembling fingers tightened around the torch.','A physical reaction shows fear rather than simply naming it.'],['The wind was strong.','The wind lashed against the ancient trees.','“Lashed” is a forceful verb suggesting hostile weather.']];let si=0,ss=0;
function renderShow(){let q=show[si];$('#a0').innerHTML=`<div class="panel"><div class="small muted">Example ${si+1} of 4</div><div class="tile" style="background:white;margin:12px 0"><div class="label muted">Basic sentence</div><div class="bigtext">${esc(q[0])}</div></div>${ss>0?`<div class="model" style="background:#eff6ff;border-color:#bfdbfe;color:#1e40af"><div class="label">Improved model</div><div class="quote">${esc(q[1])}</div></div>`:''}${ss>1?`<div class="model" style="margin-top:10px"><div class="label">Why it works</div>${esc(q[2])}</div>`:''}<div class="actions"><button class="btn" onclick="si=Math.max(0,si-1);ss=0;renderShow()">← Previous</button><button class="btn primary" onclick="ss=Math.min(2,ss+1);renderShow()">${ss===0?'Reveal improved sentence':ss===1?'Reveal explanation':'Explanation revealed'}</button><button class="btn" onclick="si=Math.min(3,si+1);ss=0;renderShow()">Next →</button></div></div>`;}renderShow();
const tech=['Personification','Simile','Metaphor','Pathetic fallacy','Sensory language','Onomatopoeia','Juxtaposition','Advanced punctuation'];const examples=['The trees whispered in the darkness.','Branches stretched like skeletal fingers.','The forest was a prison of shadows.','Thunder growled above the lonely forest.','The bitter scent of damp earth filled the air.','Crack! A branch snapped.','Golden sunlight disappeared into suffocating darkness.','The forest fell silent; something was approaching.'];const order=[4,1,7,0,6,2,5,3];let chosenTech=-1,matches={},matchChecked=false;
function renderMatch(){let full=Object.keys(matches).length===8;$('#a1').innerHTML=`<div class="panel"><div class="sectionhead">1. Choose a technique</div><div class="grid g4">${tech.map((t,i)=>`<button class="tech ${chosenTech===i?'sel':''}" style="background:${colors[i]};color:${inks[i]}" onclick="chosenTech=${i};renderMatch()">${t}</button>`).join('')}</div><h3 class="sectionhead" style="margin-top:20px">2. Select its matching example</h3><div class="grid g2">${order.map(i=>{let m=matches[i],correct=m===i;let bg=matchChecked&&correct?colors[i]:'#fff';return `<button class="match ${matchChecked?(correct?'correct':'wrong'):''}" style="background:${bg}" onclick="if(chosenTech>=0){Object.keys(matches).forEach(k=>{if(matches[k]===chosenTech)delete matches[k]});matches[${i}]=chosenTech;chosenTech=-1;matchChecked=false;renderMatch()}"><span class="tag" style="color:${m===undefined?'#64748b':inks[m]}">${m===undefined?'Click to match':esc(tech[m])}${matchChecked?(correct?' ✓':' ✕'):''}</span>${esc(examples[i])}</button>`}).join('')}</div><div class="actions"><button class="btn primary" ${full?'':'disabled'} onclick="matchChecked=true;renderMatch()">Check Answers</button><button class="btn" onclick="matches={};chosenTech=-1;matchChecked=false;renderMatch()">Reset</button><span class="muted small">${Object.keys(matches).length}/8 matched</span></div>${matchChecked?`<p class="bold">Score: ${Object.keys(matches).filter(k=>Number(k)===matches[k]).length}/8</p>`:''}</div>`;}renderMatch();
const finderText='The forest stood motionless beneath a bruised, violet sky. Ancient trees stretched their skeletal fingers towards the fading sunlight, while the bitter scent of damp earth lingered in the air. Somewhere in the distance, a branch snapped—crack! The birds had fallen silent; even the wind seemed afraid to breathe.';
const finders=[['Personification',['Ancient trees stretched their skeletal fingers','even the wind seemed afraid to breathe'],'Gives trees and wind human actions to create unease.'],['Sensory language',['bitter scent of damp earth'],'Appeals to smell, helping the reader experience the forest.'],['Metaphorical imagery',['Ancient trees stretched their skeletal fingers'],'Compares branches to skeletal fingers, suggesting something sinister.'],['Atmospheric imagery',['bruised, violet sky'],'The unusual colour and “bruised” suggest a threatening atmosphere.'],['Onomatopoeia',['crack!'],'The word imitates the sharp sound of a snapping branch.'],['Suspense and silence',['The birds had fallen silent','even the wind seemed afraid to breathe'],'The absence of familiar sounds creates tension.'],['Advanced punctuation',[';'],'The semicolon links two related ideas and controls the pace.']];let activeFind=[];
function renderFinder(){let text=finderText;const hits=[];activeFind.forEach(i=>finders[i][1].forEach(s=>{let p=0;while((p=finderText.indexOf(s,p))!==-1){hits.push({start:p,end:p+s.length,i});p+=s.length;}}));let parts='',pos=0;while(pos<text.length){let hit=hits.filter(h=>h.start<=pos&&h.end>pos);let next=pos+1;while(next<text.length&&JSON.stringify(hits.filter(h=>h.start<=next&&h.end>next).map(h=>h.i).sort())===JSON.stringify(hit.map(h=>h.i).sort()))next++;parts+=hit.length?`<mark class="phrase" style="background:${colors[hit[0].i]};color:${inks[hit[0].i]}">${esc(text.slice(pos,next))}</mark>`:esc(text.slice(pos,next));pos=next;}
$('#a2').innerHTML=`<div class="panel"><div class="eyebrow">Model paragraph</div><p class="bigtext" style="margin:12px 0 20px">${parts}</p><div class="grid g4">${finders.map((f,i)=>`<button class="pbutton" style="background:${colors[i]};color:${inks[i]};outline:${activeFind.includes(i)?'2px solid '+inks[i]:'none'}" onclick="activeFind=${activeFind.includes(i)?'activeFind.filter(x=>x!=='+i+')':'[...activeFind,'+i+']'};renderFinder()">${f[0]}</button>`).join('')}</div><div class="actions"><button class="btn" onclick="activeFind=finders.map((_,i)=>i);renderFinder()">Reveal All</button><button class="btn" onclick="activeFind=[];renderFinder()">Hide All</button></div>${activeFind.length?`<div class="grid g2" style="margin-top:14px">${activeFind.map(i=>`<div class="tile" style="background:${colors[i]}"><b style="color:${inks[i]}">${finders[i][0]}</b><div class="small">${finders[i][2]}</div></div>`).join('')}</div>`:''}</div>`;}renderFinder();
const tips=[['Plan Before You Write','Plan your opening, development, change in atmosphere and ending. Give each paragraph a clear purpose.','The forest was nice. Then it became scary. Then I went home.','Golden sunlight → fading light → sudden silence → mysterious sound → unsettling ending.'],['Show, Don’t Tell','Avoid generic words such as looked, went, nice, scary and sad. Choose precise verbs and show emotions through actions.','Sally looked through the window. She was scared.','Sally peered through the mist-covered glass. Her trembling fingers tightened around the torch.'],['Use Literary Techniques','Use personification, similes, metaphors and sensory language naturally to create vivid imagery.','The forest was dark and scary. The trees looked strange.','Twisted branches clawed at the fading daylight.'],['Vary Sentences and Punctuation','Combine longer descriptive sentences with short, dramatic sentences. Use punctuation accurately for effect.','The forest was quiet. I heard a noise. I was frightened. I ran.','The forest fell silent; something was approaching. Then—crack!'],['Create a Powerful Ending','Avoid predictable endings. Finish with a striking image, uncertainty or a meaningful change.','Then I woke up and realised it was all a dream.','Behind her, the footsteps stopped. Then came a whisper.']];
$('#a3').innerHTML=`<div class="panel">${tips.map((t,i)=>`<div class="tiprow"><div class="tiptop"><span class="num" style="background:${colors[[0,2,1,3,4][i]]};color:${inks[[0,2,1,3,4][i]]}">${i+1}</span><b>${t[0]}</b></div><div class="grid g2"><div><div class="minihead muted">WHAT TO DO</div><div class="small">${t[1]}</div></div><div class="tipright"><div class="minihead" style="color:#be123c">✕ WHAT TO AVOID</div><div class="small">${t[2]}</div><hr style="border:0;border-top:1px solid #dbe3ea"><div class="minihead" style="color:#047857">✓ BETTER EXAMPLE</div><div class="small">${t[3]}</div></div></div></div>`).join('')}</div>`;
const senses=[['Sight','👁','#eff6ff','#1d4ed8','The forest was dark.','It was as dark as night.','Pale moonlight slipped between the twisted branches, casting long shadows across the path.','Creates a vivid image instead of relying on an overused comparison.','shadowy · flickering · towering · glimmering'],['Sound','♫','#f5f3ff','#6d28d9','There was a loud noise.','It was so quiet you could hear a pin drop.','Crack! A branch snapped behind her, shattering the silence.','The sudden sound interrupts the quiet and increases tension.','rustling · echoing · snapping · murmuring'],['Smell','〰','#f0fdf4','#166534','The forest smelled strange.','It smelled as fresh as a daisy.','The bitter scent of damp earth and decaying leaves lingered beneath the trees.','Specific smells make the forest feel realistic and unsettling.','musty · earthy · pungent · fragrant'],['Touch','✋','#fff7ed','#9a3412','It was very cold.','It was as cold as ice.','An icy breeze crept beneath her coat, prickling the skin along her arms.','Physical sensations help the reader experience the cold.','clammy · prickling · coarse · freezing'],['Taste','◌','#fdf2f8','#9d174d','The air tasted bad.','It left a bad taste in her mouth.','A bitter trace of smoke settled on her tongue as she approached the clearing.','Creates a specific sensation and hints at something burning nearby.','bitter · metallic · smoky · sour']];let sense=0,senseReveal=false;const senseQuestions=[['The trees looked strange.','The gnarled branches twisted against the pale evening sky.'],['The forest was noisy.','Dry leaves crunched beneath her boots as an owl called in the distance.'],['The air smelled bad.','The sour smell of rotting leaves drifted through the damp air.'],['The ground felt cold.','Icy mud seeped through the thin fabric of her shoes.'],['The air tasted strange.','A bitter trace of smoke clung to the back of her throat.']];let senseModels=[];
function renderSense(){let s=senses[sense];$('#a4').innerHTML=`<div class="panel"><div class="grid g5">${senses.map((x,i)=>`<button class="pill ${sense===i?'active':''}" style="background:${x[2]};color:${x[3]};--accent:${x[3]}" onclick="sense=${i};senseReveal=false;renderSense()"><div style="font-size:22px">${x[1]}</div>${x[0]}</button>`).join('')}</div><div class="grid g2" style="margin-top:15px"><div class="bad"><div class="label" style="color:#be123c">✕ Avoid generic language</div>${s[4]}</div><div class="bad"><div class="label" style="color:#be123c">✕ Avoid clichés</div>${s[5]}</div></div>${senseReveal?`<div class="model" style="margin-top:12px"><div class="label">✓ Better, more original example</div><div class="quote">${s[6]}</div><hr style="border:0;border-top:1px solid #a7f3d0">${s[7]}</div><div class="tile" style="background:${s[2]};margin-top:10px"><b>Useful vocabulary:</b> ${s[8]}</div>`:`<div class="tile" style="margin-top:12px;text-align:center">Ask students to improve the descriptions before revealing the model.</div>`}<div class="actions"><button class="btn primary" onclick="senseReveal=!senseReveal;renderSense()">${senseReveal?'Hide':'Reveal'} Better Example</button></div></div><div class="panel"><h3 class="sectionhead">Student challenge – Improve the sentences</h3><div class="grid g2">${senseQuestions.map((q,i)=>`<div class="question"><b>${i+1}. ${q[0]}</b><textarea class="input" id="senseInput${i}" placeholder="Write a stronger original sentence..."></textarea><div class="actions"><button class="btn" onclick="toggleSenseModel(${i})">${senseModels.includes(i)?'Hide':'Reveal'} Model</button></div>${senseModels.includes(i)?`<div class="model small" style="margin-top:8px">${q[1]}</div>`:''}</div>`).join('')}</div></div>`;}
function toggleSenseModel(i){let saved=senseQuestions.map((_,j)=>$('#senseInput'+j)?.value||'');senseModels=senseModels.includes(i)?senseModels.filter(x=>x!==i):[...senseModels,i];renderSense();saved.forEach((v,j)=>$('#senseInput'+j).value=v)}renderSense();
const punct=[[';','Semicolon','#eff6ff','#1d4ed8','Links two closely related complete clauses.','The forest was silent; because it was night.','The forest fell silent; something was approaching.','Connects two complete thoughts to create suspense.'],[':','Colon','#f0fdf4','#166534','Introduces an explanation, list or revelation after a complete clause.','She could hear: footsteps behind her.','Only one sound broke the silence: footsteps.','Builds anticipation before revealing the sound.'],['—','Dash','#fdf2f8','#9d174d','Creates a dramatic pause or sudden interruption.','She walked—through—the—forest—slowly.','She turned towards the trees—nothing.','Creates a pause before an unsettling revelation.'],['…','Ellipsis','#fff7ed','#9a3412','Suggests hesitation or an unfinished thought.','She... walked... slowly... into... the forest...','The footsteps were getting closer…','Leaves the reader anticipating what happens next.'],['!','Exclamation','#f5f3ff','#6d28d9','Shows a cry, alarm or strong emotion. Use sparingly.','The forest was dark! She was scared! She ran!','‘Run!’ she screamed.','Emphasises urgency without overusing punctuation.'],[',','Comma','#ecfeff','#0f766e','Separates introductory phrases, clauses and items.','Beyond the trees the path disappeared into darkness.','Beyond the trees, the path disappeared into darkness.','Makes the sentence clearer and controls its rhythm.']];let pi=0,pr=false;const pq=[['The forest fell silent','something was approaching.',[';',',','!'],';','A semicolon links two complete clauses.'],['Only one sound broke the silence','footsteps.',[':',';','…'],':','A colon introduces the explanation.'],['She turned towards the trees','nothing.',['—',',',';'],'—','A dash creates a dramatic pause.'],['The footsteps were getting closer','',['…',':',','],'…','An ellipsis creates suspense.'],['‘Run','’ she screamed.',['!',':',';'],'!','An exclamation mark conveys urgency.'],['Beyond the trees','the path disappeared into darkness.',[',',';',':'],',','A comma follows the introductory phrase.']];let pa={},pc=false;
function renderPunct(){let p=punct[pi];$('#a5').innerHTML=`<div class="panel"><div class="grid g6">${punct.map((x,i)=>`<button class="pill ${pi===i?'active':''}" style="background:${x[2]};color:${x[3]};--accent:${x[3]}" onclick="pi=${i};pr=false;renderPunct()"><div style="font-size:25px">${x[0]}</div><span class="small">${x[1]}</span></button>`).join('')}</div><p><b>${p[1]}:</b> ${p[4]}</p><div class="grid g2"><div class="bad"><div class="label" style="color:#be123c">✕ What to avoid</div>${p[5]}</div>${pr?`<div class="model"><div class="label">✓ Better example</div><div style="font-size:19px;font-weight:700">${p[6]}</div><div class="small">${p[7]}</div></div>`:`<div class="bad muted">Ask students to improve the sentence before revealing the model.</div>`}</div><div class="actions"><button class="btn primary" onclick="pr=!pr;renderPunct()">${pr?'Hide':'Reveal'} Better Example</button></div></div><div class="panel"><h3 class="sectionhead">Quick punctuation quiz</h3><div class="grid g2">${pq.map((q,i)=>`<div class="question"><b class="small">${i+1}. ${q[0]} ___ ${q[1]}</b><div>${q[2].map(opt=>`<button class="btn ${pa[i]===opt?'sel':''}" onclick="pa[${i}]=${JSON.stringify(opt)};pc=false;renderPunct()">${opt}</button>`).join('')}</div>${pc?`<div class="feedback" style="color:${pa[i]===q[3]?'#047857':'#be123c'}">${pa[i]===q[3]?'✓ Correct':'✕ Answer: '+q[3]} · ${q[4]}</div>`:''}</div>`).join('')}</div><div class="actions"><button class="btn primary" ${Object.keys(pa).length===6?'':'disabled'} onclick="pc=true;renderPunct()">Check Answers</button><button class="btn" onclick="pa={};pc=false;renderPunct()">Reset</button><span class="muted small">${Object.keys(pa).length}/6 answered</span></div>${pc?`<b>Score: ${pq.filter((q,i)=>pa[i]===q[3]).length}/6</b>`:''}</div><div class="note">Exam reminder: accuracy and effect matter more than using lots of punctuation marks. A correct full stop is better than an incorrect semicolon.</div>`;}renderPunct();
const plans={'5':[['Opening','medium','Introduce the forest and establish the atmosphere.','The forest stretched beneath a pale evening sky, its branches reaching across the narrow path.'],['Develop the Setting','medium','Use sensory language to make the setting vivid.','Damp leaves softened her footsteps, while the scent of wet earth rose from the ground.'],['Change in Atmosphere','medium','Introduce a subtle change, such as fading light or an unusual sound.','Gradually, the last traces of sunlight disappeared and the birds stopped singing.'],['Build Tension','medium','Focus on one unsettling detail and slow the pace.','Beyond the trees, something moved. She waited, listening for another sound.'],['Powerful Ending','medium','Finish with an image, revelation or unanswered question.','The path behind her was empty, but a second set of footprints had appeared beside her own.']],'7':[['Opening','medium','Establish the setting and atmosphere.','The forest stretched beneath a pale evening sky, its branches reaching across the narrow path.'],['Sensory Description','medium','Use sight, sound, smell and touch selectively.','Damp leaves softened her footsteps, and the bitter scent of wet earth lingered in the air.'],['Change in Atmosphere','medium','Show that something about the setting has changed.','The sunlight faded. One by one, the birds fell silent.'],['Sudden Moment','short','Use a very short paragraph to interrupt the flow.','Crack!'],['Build Suspense','medium','Slow down and develop the character’s reaction.','She stopped. Her fingers tightened around the torch as she searched the darkness between the trees.'],['Dramatic Pause','short','Use a second short paragraph to emphasise a revelation.','Footsteps.'],['Powerful Ending','medium','End with a memorable image or uncertainty.','She turned towards the sound, but the path was empty. Then the footsteps began again—directly behind her.']]};let mode='7',para=0,paraReveal=false;
function renderPara(){let arr=plans[mode],p=arr[para];$('#a6').innerHTML=`<div class="panel"><div class="actions" style="margin:0 0 14px"><button class="btn ${mode==='5'?'primary':''}" onclick="mode='5';para=0;paraReveal=false;renderPara()">5 Developed Paragraphs</button><button class="btn ${mode==='7'?'primary':''}" onclick="mode='7';para=0;paraReveal=false;renderPara()">7 Paragraphs · 2 Short</button></div><div class="grid g2"><div>${arr.map((x,i)=>`<button class="para ${x[1]==='short'?'short':''} ${para===i?'active':''}" onclick="para=${i};paraReveal=false;renderPara()"><span class="n">${i+1}</span><span><b>${x[0]}</b><br><span class="small muted">${x[1]==='short'?'Short impact paragraph':'Developed paragraph'}</span></span></button>`).join('')}</div><div><div class="eyebrow">Paragraph ${para+1}</div><h3>${p[0]}</h3><div class="tile"><b>Purpose</b><p>${p[2]}</p></div>${paraReveal?`<div class="model" style="margin-top:12px"><div class="label">Model example</div><div class="quote" style="font-size:18px">${p[3]}</div></div>`:`<div class="tile muted" style="margin-top:12px">Ask students what this paragraph should contain before revealing the model.</div>`}<div class="actions"><button class="btn primary" onclick="paraReveal=!paraReveal;renderPara()">${paraReveal?'Hide':'Reveal'} Model Paragraph</button></div></div></div></div><div class="panel"><h3 class="sectionhead">Why use two short paragraphs?</h3><div class="grid g2"><div class="tile"><b>Without a short paragraph</b><p>She walked deeper into the forest. Suddenly, a branch snapped. She stopped and looked around.</p><div class="small muted">The important moment is buried inside the description.</div></div><div class="model"><b>With a short paragraph</b><p>She walked deeper into the forest.</p><h3 style="border-top:1px solid #a7f3d0;border-bottom:1px solid #a7f3d0;padding:9px 0">Crack!</h3><p>She stopped and looked around.</p><div class="small">The isolated sound becomes more dramatic.</div></div></div></div><div class="note">AQA does not require five or seven paragraphs. These are planning options; every paragraph should have a clear purpose.</div>`;}renderPara();
const views=[['First Person','I / We','#eff6ff','#1d4ed8','I stepped into the forest, my hands trembling as the darkness swallowed the path.','The reader experiences events through the narrator’s thoughts and feelings.','Useful for personal experiences, emotions and fear.'],['Second Person','You','#ecfdf5','#047857','You step into the forest. The air turns colder. Behind you, a branch snaps. You stop breathing.','The reader becomes the person experiencing the scene, making it immediate and immersive.','Try this in a deliberate paragraph to pull the reader into your world.'],['Third Person','He / She / They','#f5f3ff','#6d28d9','She stepped into the forest, unaware that something was moving silently behind her.','The writer can describe a character and create suspense through what the character does not know.','Useful for storytelling and an outside perspective.']];const perspectiveExamples=[['Walking into a Forest','Create atmosphere','She stepped into the forest. The branches moved above her, and a cold breeze brushed against her face. She heard footsteps behind her but could see nobody.','You step into the forest. Above you, the branches twist and sway. A cold breeze brushes against your face. Behind you, footsteps echo through the darkness. You turn. Nobody is there.','The reader experiences the sounds, cold air and uncertainty as though standing in the forest.'],['An Unexpected Sound','Build suspense','He heard a sudden noise from the darkness. His heart began to race. He turned around, but there was nobody behind him.','A sudden crack echoes behind you. Your heartbeat quickens. You turn towards the darkness. Nothing. Yet you can feel that something is watching you.','Directly addressing the reader creates a sense of danger. Short sentences increase tension.'],['A Stormy Journey','Use sensory language','She walked along the deserted road. Rain soaked her clothes, and the freezing wind made her shiver. She struggled to see the road ahead.','Rain lashes against your face. Your clothes cling to your skin as the freezing wind cuts through you. Ahead, the road disappears into a curtain of darkness.','The reader is invited to feel the rain, cold and discomfort, making the journey vivid.']];let view=1,viewReveal=false,exampleView=0,exampleReveal=false,writeReveal=false,studentText='';
function renderView(){let v=views[view],e=perspectiveExamples[exampleView];$('#a7').innerHTML=`<div class="panel"><h3 class="sectionhead">Part 1 – Three perspectives</h3><div class="grid g3">${views.map((x,i)=>`<button class="pill ${view===i?'active':''}" style="background:${x[2]};color:${x[3]};--accent:${x[3]}" onclick="view=${i};viewReveal=false;renderView()">${x[0]}<br><span style="font-size:20px">${x[1]}</span></button>`).join('')}</div><div class="tile" style="background:${v[2]};margin-top:13px"><div class="label">${v[0]} – model example</div><p class="bigtext" style="font-size:20px">${v[4]}</p>${viewReveal?`<div class="tile" style="background:white">${v[5]}<br><b>${v[6]}</b></div>`:''}<div class="actions"><button class="btn" onclick="viewReveal=!viewReveal;renderView()">${viewReveal?'Hide':'Explain'} the Effect</button></div></div></div><div class="panel"><h3 class="sectionhead">Part 2 – The power of “you”</h3><div class="grid g2"><div class="tile"><div class="label muted">Third person – the reader observes</div><p>She walked along the narrow path. The wind grew colder, and a strange sound came from the trees. She stopped, unsure whether to continue.</p></div><div class="model"><div class="label">Second person – the reader experiences</div><p>You follow the narrow path. The wind brushes against your neck. Somewhere behind you, something moves. You turn. Nothing. Yet you can feel that you are no longer alone.</p></div></div></div><div class="panel"><h3 class="sectionhead">Part 3 – Bring the reader into your world</h3><div class="grid g3">${perspectiveExamples.map((x,i)=>`<button class="pill ${exampleView===i?'active':''}" onclick="exampleView=${i};exampleReveal=false;renderView()">${i+1}. ${x[0]}<br><span class="small muted">${x[1]}</span></button>`).join('')}</div><div class="tile" style="margin-top:12px"><div class="label muted">Third person – the reader observes</div><p>${e[2]}</p></div>${exampleReveal?`<div class="model" style="margin-top:12px"><div class="label">Second person – the reader experiences</div><div class="quote" style="font-size:19px">${e[3]}</div><div class="small">Why it works: ${e[4]}</div></div>`:''}<div class="actions"><button class="btn primary" onclick="exampleReveal=!exampleReveal;renderView()">${exampleReveal?'Hide':'Reveal'} Second-Person Version</button></div></div><div class="panel"><h3 class="sectionhead">Part 4 – Student challenge</h3><div class="tile"><b>Original:</b> She walked into the forest. She heard a strange noise and felt frightened.</div><p class="small muted">Rewrite in second person. Add sensory details and create atmosphere.</p><textarea class="input" id="viewAnswer" placeholder="Begin with You...">${esc(studentText)}</textarea><div class="actions"><button class="btn primary" onclick="studentText=$('#viewAnswer').value;writeReveal=!writeReveal;renderView()">${writeReveal?'Hide':'Reveal'} Model Answer</button></div>${writeReveal?`<div class="model" style="margin-top:12px"><div class="label">Model second-person description</div><div class="quote">You step beneath the towering branches. The cold air brushes against your face. A sudden crack echoes through the trees. Your heartbeat quickens. You are not alone.</div></div>`:''}</div><div class="note">Second person is a creative option, not an AQA requirement. Experiment with one or two paragraphs where it feels natural, but avoid random viewpoint switches that confuse the reader.</div>`;}renderView();
const checklistGroups=[['Planning & Paragraphs','#eff6ff','#1d4ed8',[['Plan the structure','Include a clear opening, development, change in atmosphere and memorable ending.'],['Organise paragraphs','Aim for 5 developed paragraphs or 7 paragraphs with 2 deliberately short paragraphs, if suitable.'],['Control the pace','Use short paragraphs for a sudden sound, dramatic moment or revelation.']]],['Vocabulary & Literary Techniques','#f0fdf4','#166534',[['Show, don’t tell','Replace generic words such as scary, nice and looked with precise verbs, actions and imagery.'],['Use sensory language','Include relevant sight, sound, smell and touch; use taste only where natural.'],['Avoid clichés','Replace expressions such as as cold as ice or dark as night with original descriptions.'],['Include literary techniques','Use personification, similes or metaphors naturally, rather than forcing them into every sentence.']]],['Sentence Variety & Punctuation','#f5f3ff','#6d28d9',[['Vary sentence lengths','Combine longer descriptive sentences with short, dramatic sentences for impact.'],['Experiment with perspective','Consider using you to immerse the reader in one or two paragraphs, but keep viewpoint changes controlled.'],['Use advanced punctuation','Try accurate semicolons (;), colons (:), dashes (—) or ellipses (…) where they improve meaning.'],['Vary sentence openings','Avoid starting every sentence with I, She or The. Vary how sentences begin.']]],['Ending & Technical Accuracy','#fff7ed','#9a3412',[['Create a powerful ending','Finish with a striking image, uncertainty or meaningful change. Avoid it was all a dream.'],['Proofread carefully','Check spelling, capital letters, full stops, commas, tense consistency and paragraph breaks.']]]];let hw=1,done={};const examPhoto="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAQDAwMDAgQDAwMEBAQFBgoGBgUFBgwICQcKDgwPDg4MDQ0PERYTDxAVEQ0NExoTFRcYGRkZDxIbHRsYHRYYGRj/2wBDAQQEBAYFBgsGBgsYEA0QGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYG  language, original imagery, paragraph structure and purposeful punctuation.</p></div><div class="taskbox"><div class="label" style="color:#1d4ed8">Homework 2 · Set next lesson</div><h3>🚗 Journey story</h3><p class="small">Use the original exam photograph as inspiration. Apply feedback from Homework 1 to improve your second response.</p></div></div><p class="small muted">Suggested time: 45 minutes for each task, including planning and proofreading.</p></div><div class="panel"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap"><h3 class="sectionhead">Detailed student writing checklist</h3><div class="actions" style="margin:0"><button class="btn ${hw===1?'primary':''}" onclick="hw=1;renderHW()">HW 1</button><button class="btn ${hw===2?'primary':''}" onclick="hw=2;renderHW()">HW 2</button></div></div><div class="small muted">Tick each target after checking your own writing. Each homework has a separate checklist.</div><div class="actions" style="justify-content:space-between"><b>${count} of ${total} checked</b><span class="small muted">${Math.round(count/total*100)}%</span></div><div class="progress"><div style="width:${count/total*100}%"></div></div><div class="grid g2" style="margin-top:16px">${checklistGroups.map((g,gi)=>`<div class="taskbox"><div class="pill" style="background:${g[1]};color:${g[2]};text-align:left">${g[0]}</div>${g[3].map((item,i)=>`<label class="check"><input type="checkbox" ${done[`${hw}-${gi}-${i}`]?'checked':''} onchange="done['${hw}-${gi}-${i}']=this.checked;renderHW()"><span><b>${item[0]}</b><br><span class="small muted">${item[1]}</span></span></label>`).join('')}</div>`).join('')}</div><div class="actions"><button class="btn" onclick="Object.keys(done).filter(k=>k.startsWith(hw+'-')).forEach(k=>delete done[k]);renderHW()">Reset this homework checklist</button></div></div><div class="note">The original exam offers either/or. Completing both on separate occasions is additional practice. These checklist techniques are suggestions, not compulsory AQA requirements.</div>`;}renderHW();go(0);
